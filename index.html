<style>
  :root {
    --brand:#7A4667; --brand-hover:#9B7A8E; --sand:#B7A897; --canvas:#F7F4EE;
    --ink:#3A2A32; --line:#E2D8CC; --card:#EFE8E1; --ok:#A7A087; --err:#D7A9B2;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { background: var(--canvas); color: var(--ink); font-family: 'Poppins', sans-serif; overflow-x: hidden; }
  ::selection { background: var(--brand); color: #fff; }

  /* ---------- Scrollbar ---------- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--canvas); }
  ::-webkit-scrollbar-thumb { background: var(--sand); border-radius: 99px; border: 2px solid var(--canvas); }
  ::-webkit-scrollbar-thumb:hover { background: var(--brand); }

  /* ---------- Depth / 3D shadow system ---------- */
  .depth-1 { box-shadow: 0 1px 2px rgba(58,42,50,.04), 0 4px 12px rgba(58,42,50,.06); }
  .depth-2 { box-shadow: 0 2px 6px rgba(58,42,50,.06), 0 12px 30px rgba(58,42,50,.10); }
  .depth-3 { box-shadow: 0 10px 24px rgba(58,42,50,.10), 0 30px 60px rgba(58,42,50,.16); }
  .depth-brand { box-shadow: 0 10px 24px rgba(122,70,103,.22), 0 24px 48px rgba(122,70,103,.20); }

  /* ---------- Glassmorphism ---------- */
  .glass {
    background: rgba(247,244,238,.72);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid rgba(226,216,204,.7);
  }
  .glass-dark {
    background: rgba(58,42,50,.55);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid rgba(255,255,255,.12);
  }

  /* ---------- Perspective / tilt ---------- */
  .scene { perspective: 1200px; }
  .tilt { transform-style: preserve-3d; transition: transform .5s cubic-bezier(0.22,1,0.36,1), box-shadow .5s cubic-bezier(0.22,1,0.36,1); will-change: transform; }

  /* ---------- Keyframe animations ---------- */
  @keyframes float3d {
    0%,100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
    50%     { transform: translateY(-14px) rotateX(4deg) rotateY(-4deg); }
  }
  .anim-float { animation: float3d 7s ease-in-out infinite; }
  .anim-float-slow { animation: float3d 11s ease-in-out infinite; }

  @keyframes spinSlow { to { transform: rotate(360deg); } }
  .anim-spin-slow { animation: spinSlow 26s linear infinite; }

  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .skeleton { position: relative; overflow: hidden; background: var(--card); }
  .skeleton::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    animation: shimmer 1.5s infinite;
  }

  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .marquee-track { animation: marquee 26s linear infinite; }
  .marquee-wrap:hover .marquee-track { animation-play-state: paused; }

  @keyframes riseIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .reveal { opacity: 0; }
  .reveal.in { animation: riseIn .8s cubic-bezier(0.22,1,0.36,1) forwards; }

  @keyframes popCheck { 0% { transform: scale(0) rotate(-25deg); } 60% { transform: scale(1.25) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }
  .pop-check { animation: popCheck .45s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  @keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .toast-in { animation: toastIn .4s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  @keyframes sparkle { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  .sparkle { animation: sparkle 3s ease-in-out infinite; }

  /* ---------- Buttons ---------- */
  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    font-weight: 500; letter-spacing: .01em; border-radius: 999px; overflow: hidden;
    transition: transform .35s cubic-bezier(0.34,1.56,0.64,1), box-shadow .35s ease, background-color .3s ease, color .3s ease;
  }
  .btn:active { transform: scale(.95); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-hover); box-shadow: 0 12px 28px rgba(122,70,103,.32); transform: translateY(-2px); }
  .btn-ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
  .btn-ghost:hover { background: var(--brand); color: #fff; transform: translateY(-2px); }
  .btn[disabled] { opacity: .5; pointer-events: none; filter: grayscale(.3); }
  .btn.loading { pointer-events: none; }
  .btn.loading .btn-label { opacity: 0; }
  .btn.loading::after {
    content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spinSlow .7s linear infinite;
  }

  /* ---------- Inputs ---------- */
  .field {
    width: 100%; background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
    padding: .8rem 1rem; color: var(--ink); font-size: .92rem;
    transition: border-color .3s ease, box-shadow .3s ease, background-color .3s ease;
  }
  .field::placeholder { color: #b8a9a0; }
  .field:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(122,70,103,.12); background: #fff; }
  .field.invalid { border-color: var(--err); box-shadow: 0 0 0 4px rgba(215,169,178,.18); }
  .field:disabled { background: var(--card); cursor: not-allowed; }

  /* ---------- Product card ---------- */
  .pcard-img { transition: transform .9s cubic-bezier(0.22,1,0.36,1); }
  .pcard:hover .pcard-img { transform: scale(1.09); }
  .pcard .quick-add { transform: translateY(120%); transition: transform .45s cubic-bezier(0.34,1.56,0.64,1); }
  .pcard:hover .quick-add { transform: translateY(0); }

  .nav-link { position: relative; }
  .nav-link::after {
    content: ""; position: absolute; left: 0; bottom: -4px; height: 2px; width: 100%;
    background: var(--brand); transform: scaleX(0); transform-origin: right; transition: transform .4s cubic-bezier(0.22,1,0.36,1);
  }
  .nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); transform-origin: left; }

  .cat-ring { transition: transform .5s cubic-bezier(0.34,1.56,0.64,1), box-shadow .5s ease; }
  .cat-item:hover .cat-ring { transform: translateY(-8px) scale(1.05); box-shadow: 0 18px 36px rgba(122,70,103,.25); }

  .drawer { transition: transform .5s cubic-bezier(0.22,1,0.36,1); }
  .backdrop { transition: opacity .4s ease; }

  .step-dot { transition: all .5s cubic-bezier(0.22,1,0.36,1); }

  /* ---------- Custom Spaces — curved auto-scroll filmstrip hero ---------- */
  .filmstrip {
    overflow: hidden; position: relative;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
  }
  .filmstrip-bow {
    transform: perspective(1600px) rotateX(var(--rx, 6deg)) rotateY(var(--ry, 0deg));
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .filmstrip-track {
    display: flex; gap: clamp(.6rem, 1.6vw, 1.15rem); width: max-content;
    animation: strip 48s linear infinite;
  }
  .filmstrip:hover .filmstrip-track { animation-play-state: paused; }
  @keyframes strip { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .film-panel {
    position: relative; flex: none; width: clamp(188px, 22vw, 300px);
    aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; cursor: pointer;
    background: linear-gradient(158deg, var(--brand-hover) 0%, var(--brand) 55%, #5c3350 100%);
    box-shadow: 0 20px 44px rgba(58,42,50,.26), inset 0 0 0 1px rgba(58,42,50,.10);
    transition: transform .6s cubic-bezier(0.22, 1, 0.36, 1), box-shadow .6s ease;
  }
  .film-panel svg { opacity: .42; mix-blend-mode: soft-light; }
  .film-panel.has-photo svg { display: none; }
  .film-panel::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.10), transparent 30%, rgba(46,30,40,.45));
  }
  .film-panel:hover { transform: translateY(-12px) scale(1.035); box-shadow: 0 30px 60px rgba(122,70,103,.30), inset 0 0 0 1px rgba(255,255,255,.3); }
  .filmstrip::after {
    content: ""; position: absolute; left: 8%; right: 8%; bottom: 4px; height: 34px;
    background: radial-gradient(ellipse at center, rgba(58,42,50,.20), transparent 70%);
    filter: blur(6px); pointer-events: none;
  }
  .link-underline {
    text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px;
    text-decoration-color: var(--sand); transition: color .3s ease, text-decoration-color .3s ease;
  }
  .link-underline:hover { color: var(--brand) !important; text-decoration-color: var(--brand); }

  /* ---------- Script wordmark logo ---------- */
  .wordmark { display: inline-flex; flex-direction: column; align-items: flex-start; line-height: .82; color: var(--brand); }
  .wm-script { font-family: 'Sacramento', 'Playfair Display', cursive; font-weight: 400; font-size: 1.75rem; letter-spacing: .01em; }
  .wm-sub { font-family: 'Poppins', sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .42em; font-size: .58rem; margin: -.12em 0 0 .18em; }
  .wordmark.wm-lg .wm-script { font-size: clamp(2.4rem, 6vw, 3.4rem); }
  .wordmark.wm-lg .wm-sub { font-size: clamp(.7rem, 1.4vw, .9rem); letter-spacing: .5em; }
  .wordmark.wm-on-brand { color: #fff; }

  /* Real in-hand photos carry a caption strip at the very top — bias the crop down */
  .photo-crop { object-position: 50% 66%; }

  [x-cloak] { display: none !important; }
  .no-scroll { overflow: hidden; }

  @media (prefers-reduced-motion: reduce) {
    *, *::after, *::before { animation-duration: .001s !important; transition-duration: .05s !important; }
  }
</style>

/* ---------- Decorative SVG motif per category (no external assets) ---------- */
function motif(cat, key) {
  const g = `grad-${key}`;
  const base = `<defs>
    <linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE8E1"/><stop offset=".55" stop-color="#B7A897"/><stop offset="1" stop-color="#9B7A8E"/>
    </linearGradient>
    <radialGradient id="${g}-s" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#F7F4EE" stop-opacity=".95"/><stop offset="1" stop-color="#F7F4EE" stop-opacity="0"/>
    </radialGradient></defs>
    <rect width="400" height="400" fill="url(#${g})"/>
    <rect width="400" height="400" fill="url(#${g}-s)"/>`;
  const stroke = '#7A4667', bead = '#3A2A32';
  const shapes = {
    'Bangles': `<circle cx="200" cy="205" r="120" fill="none" stroke="${stroke}" stroke-width="14" opacity=".85"/>
      <circle cx="200" cy="205" r="95" fill="none" stroke="#F7F4EE" stroke-width="6" opacity=".7"/>
      ${beadRing(200,205,120,18)}`,
    'Bracelets': `<path d="M70 210 Q200 90 330 210 Q200 300 70 210 Z" fill="none" stroke="${stroke}" stroke-width="12"/>
      ${beadRow(90,210,320,210,12)}`,
    'Rings/Ringlets': `<circle cx="200" cy="230" r="80" fill="none" stroke="${stroke}" stroke-width="16"/>
      <path d="M200 150 l26 -48 h-52 z" fill="#F7F4EE" stroke="${stroke}" stroke-width="6"/>

    'Earrings': `${earring(150)}${earring(250)}`,
    'Necklaces': `<path d="M60 90 Q200 300 340 90" fill="none" stroke="${stroke}" stroke-width="10"/>
      ${beadArc()}<circle cx="200" cy="250" r="22" fill="${bead}"/><circle cx="200" cy="250" r="10" fill="#F7F4EE"/>`,
    'Anklets': `<path d="M60 170 Q200 120 340 170 Q200 250 60 170 Z" fill="none" stroke="${stroke}" stroke-width="9"/>
      ${beadRow(80,170,320,170,10)}<circle cx="200" cy="235" r="12" fill="${bead}"/>`,
    'Stainless steel jewelry': `<rect x="120" y="120" width="160" height="160" rx="26" fill="none" stroke="${stroke}" stroke-width="14"/>

      <path d="M120 250 q40 40 90 20" fill="none" stroke="${stroke}" stroke-width="8"/>`,
  };
  function beadRing(cx,cy,r,c){let o='';for(let i=0;i<c;i++){const a=(i/c)*Math.PI*2;o+=`<circle cx="${cx+Math.cos(a)*r}" cy="${cy+Math.sin(a)*r}" r="7" fill="${bead}"/>`;}return o;}
  function beadRow(x1,y1,x2,y2,c){let o='';for(let i=0;i<c;i++){const t=i/(c-1);o+=`<circle cx="${x1+(x2-x1)*t}" cy="${y1+(y2-y1)*t}" r="6" fill="${bead}"/>`;}return o;}
  function beadArc(){let o='';for(let i=0;i<=12;i++){const t=i/12,x=60+280*t,y=90+Math.sin(t*Math.PI)*180;o+=`<circle cx="${x}" cy="${y}" r="6" fill="${bead}"/>`;}return o;}
  function earring(x){return `<path d="M${x} 110 v60" stroke="${stroke}" stroke-width="6"/><circle cx="${x}" cy="105" r="10" fill="none" stroke="${stroke}" stroke-width="6"/><path d="M${x} 175 l30 55 h-60 z" fill="#F7F4EE" stroke="${stroke}" stroke-width="6"/><circle cx="${x}" cy="255" r="14" fill="${bead}"/>`;}
  return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">${base}${shapes[cat]||shapes['Sets']}</svg>`;
}

const getProduct = id => S.products.find(p => p.id === id);
const cartDetailed = () => S.cart.map(c => ({ ...c, p: getProduct(c.id) })).filter(c => c.p);
const cartCount = () => S.cart.reduce((s, c) => s + c.qty, 0);
const cartSubtotal = () => cartDetailed().reduce((s, c) => s + c.p.price * c.qty, 0);
const cartShipping = () => shipCost(cartSubtotal());
const cartTotal = () => (S.cart.length ? cartSubtotal() + cartShipping() : 0);

function addToCart(id) {
  const p = getProduct(id);
  if (!p || !p.stock) { toast('Out of stock', 'err'); return; }
  const line = S.cart.find(c => c.id === id);
  if (line) line.qty++; else S.cart.push({ id, qty: 1 });
  save(); render(); toast(`${p.name} added`, 'ok');
  pulseCart();
}
function setQty(id, qty) {
  qty = Math.max(0, qty);
  if (qty === 0) S.cart = S.cart.filter(c => c.id !== id);
  else { const l = S.cart.find(c => c.id === id); if (l) l.qty = qty; }
  save(); render();
}
function clearCart() { S.cart = []; save(); render(); }
function openCart(v) { S.cartOpen = v; document.body.classList.toggle('no-scroll', v); render(); }
function goto(route) {
  S.route = route;

function setCategory(c) { S.activeCategory = c; S.route = 'shop'; window.scrollTo({top: 320, behavior:'smooth'}); save(); render(); }

/* ---- checkout ---- */
function nextStep() {
  if (S.checkoutStep === 1 && !validateShipping()) { toast('Please complete required fields', 'err'); render(); return; }
  S.checkoutStep = Math.min(3, S.checkoutStep + 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  save(); render();
}
function prevStep() { S.checkoutStep = Math.max(1, S.checkoutStep - 1); save(); render(); }
function validateShipping() {
  const s = S.shipping;
  return s.name.trim() && /^[0-9+\-\s]{7,}$/.test(s.phone) && /\S+@\S+\.\S+/.test(s.email) && s.address.trim() && s.city.trim();
}
function bindShipping(k, v) { S.shipping[k] = v; save(); }
async function placeOrder(btn) {
  btn.classList.add('loading');
  const items = cartDetailed().map(c => ({ name: c.p.name, qty: c.qty, price: c.p.price }));
  const sub = cartSubtotal();
  const ship = shipCost(sub);
  const order = {
    id: 'BF-' + (1043 + S.orders.length),
    name: S.shipping.name, phone: S.shipping.phone, email: S.shipping.email,
    city: S.shipping.city, address: S.shipping.address, postal: S.shipping.postal, notes: S.shipping.notes,
    method: S.paymentMethod, items, subtotal: sub, shipping: ship, total: sub + ship,
    status: 'Pending Payment Verification', date: new Date().toISOString().slice(0, 10),
  };
  // Persist to the server so the owner sees it in the admin panel from any device.
  // Falls back to local-only if the API is not available (e.g. opened as a plain file).
  try {
    const res = await fetch('/api/orders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order),
    });
    if (res.ok) { const saved = await res.json(); if (saved && saved.id) order.id = saved.id; order.synced = true; }
  } catch (e) { /* offline / static hosting — keep local copy */ }

  S.orders.unshift(order);
  S.cart = [];
  S.lastOrder = order;
  S.checkoutStep = 3;
  save(); render();
  btn.classList.remove('loading');
  toast(order.synced ? 'Order placed — send your payment proof' : 'Order saved — send your payment proof', 'ok');
}

/* Pull server-side orders into the admin panel (merges with any local ones) */
async function syncOrders() {
  try {
    const res = await fetch('/api/orders');
    if (!res.ok) return;
    const remote = await res.json();
    if (!Array.isArray(remote)) return;
    const seen = new Set(remote.map(o => o.id));
    S.orders = [...remote, ...S.orders.filter(o => !seen.has(o.id))];
    save(); if (S.view === 'admin') render();
  } catch (e) {}
}

function adminUpsert(form) {
  const data = Object.fromEntries(new FormData(form));
  const payload = {
    name: data.name.trim(),
    category: data.category,
    price: Number(data.price) || 0,
    oldPrice: data.oldPrice ? Number(data.oldPrice) : undefined,
    stock: data.stock === 'in',
    bestSeller: !!data.bestSeller,
    newArrival: !!data.newArrival,
    desc: data.desc?.trim() || '',
    img: data.img?.trim() || null,
  };
  if (!payload.name) { toast('Name required', 'err'); return; }
  if (data.id) {
    Object.assign(getProduct(data.id), payload);
    toast('Product updated', 'ok');
  } else {
    S.products.unshift({ id: uid(), ...payload });
    toast('Product added', 'ok');
  }
  S.editingId = null;
  save(); render();
}
function adminEdit(id) { S.editingId = id; save(); render(); document.getElementById('admin-form-anchor')?.scrollIntoView({behavior:'smooth'}); }
function adminDelete(id) {
  if (!confirm('Delete this product?')) return;
  S.products = S.products.filter(p => p.id !== id);
  S.cart = S.cart.filter(c => c.id !== id);
  save(); render(); toast('Product deleted', 'err');
}
function adminToggleStock(id) { const p = getProduct(id); p.stock = !p.stock; save(); render(); }
const ORDER_STATUSES = ['Pending Payment Verification', 'Processing', 'Shipped'];
function cycleOrderStatus(id) {
  const o = S.orders.find(x => x.id === id);
  const i = ORDER_STATUSES.indexOf(o.status);
  setOrderStatus(id, ORDER_STATUSES[(i + 1) % ORDER_STATUSES.length]);
  toast(`${o.id} → ${o.status}`, 'ok');
}
function setOrderStatus(id, status) {
  const o = S.orders.find(x => x.id === id);
  o.status = status; save(); render();
  fetch('/api/orders', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, status }),
  }).catch(() => {});
}

function toast(msg, kind = 'ok') {
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  const color = kind === 'err' ? 'var(--err)' : 'var(--ok)';
  el.className = 'toast-in pointer-events-auto glass depth-2 rounded-full px-5 py-3 text-sm font-medium flex items-center gap-2';
  el.style.color = 'var(--ink)';
  el.innerHTML = `<span class="inline-flex h-5 w-5 items-center justify-center rounded-full text-white" style="background:${color}">${kind === 'err' ? '!' : '✓'}</span>${msg}`;
  host.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s, transform .4s'; el.style.opacity = '0'; el.style.transform = 'translateY(12px)'; setTimeout(() => el.remove(), 400); }, 2400);
}
function pulseCart() {
  const c = document.getElementById('cart-btn');
  if (!c) return;
  c.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 450, easing: 'cubic-bezier(0.34,1.56,0.64,1)' });
}

/* ==================================================================== */
/*  EFFECTS                                                              */
/* ==================================================================== */
function setupReveal() {
  const els = document.querySelectorAll('.reveal:not(.in)');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
  els.forEach(el => io.observe(el));
}

function setupFilmstrip() {
  const fs = document.getElementById('filmstrip');
  if (!fs) return;
  const bow = fs.querySelector('.filmstrip-bow');
  fs.querySelectorAll('.film-panel').forEach(p => p.addEventListener('click', () => setCategory(p.dataset.cat)));
  if (matchMedia('(pointer: coarse)').matches) return;
  fs.addEventListener('pointermove', e => {
    const r = fs.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    bow.style.setProperty('--ry', (px * 6).toFixed(2) + 'deg');
    bow.style.setProperty('--rx', (6 - py * 4).toFixed(2) + 'deg');
  });
  fs.addEventListener('pointerleave', () => {
    bow.style.setProperty('--ry', '0deg');
    bow.style.setProperty('--rx', '6deg');
  });
}

function setupTilt() {
  if (matchMedia('(pointer: coarse)').matches) return;
  document.querySelectorAll('.tilt').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `rotateY(${px * 9}deg) rotateX(${-py * 9}deg) translateZ(6px)`;
    });
    el.addEventListener('pointerleave', () => { el.style.transform = ''; });
  });
}

function sectionHead(title, sub, left = false) {
