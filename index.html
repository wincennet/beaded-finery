<style>

    background: rgba(58,42,50,.55);

    border: 1px solid rgba(255,255,255,.12);

  /* ---------- Perspective / tilt ---------- */
  .scene { perspective: 1200px; }
  .tilt { transform-style: preserve-3d; transition: transform .5s cubic-bezier(0.22,1,0.36,1), box-shadow .5s cubic-bezier(0.22,1,0.36,1); will-change: transform; }

function price(pkr) {
  const cur = S.fx.currency, rate = S.fx.rate || 1;

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem('beadedFinery_v1'));
    if (raw && raw.products) return { ...DEFAULT_STATE, ...raw };
  } catch (e) {}
  return { ...DEFAULT_STATE, products: structuredClone(SEED_PRODUCTS), orders: seedOrders() };
}
function save() { try { localStorage.setItem('beadedFinery_v1', JSON.stringify(S)); } catch (e) {} }

  return [];

const getProduct = id => S.products.find(p => p.id === id);
const cartDetailed = () => S.cart.map(c => ({ ...c, p: getProduct(c.id) })).filter(c => c.p);
const cartCount = () => S.cart.reduce((s, c) => s + c.qty, 0);
const cartSubtotal = () => cartDetailed().reduce((s, c) => s + c.p.price * c.qty, 0);
const cartBlocked = () => shipCost(cartSubtotal()) === null;
const cartShipping = () => { const c = shipCost(cartSubtotal()); return c == null ? 0 : c; };
const cartTotal = () => (S.cart.length ? cartSubtotal() + cartShipping() : 0);

function addToCart(id) {
  const p = getProduct(id);
  if (!p || !p.stock) { toast('Out of stock', 'err'); return; }
  const line = S.cart.find(c => c.id === id);
  if (line) line.qty++; else S.cart.push({ id, qty: 1 });
  save(); render(); toast(`${p.name} added`, 'ok');
  pulseCart();
}
function setQty(id, qty) {
  qty = Math.max(0, qty);
  if (qty === 0) S.cart = S.cart.filter(c => c.id !== id);
  else { const l = S.cart.find(c => c.id === id); if (l) l.qty = qty; }
  save(); render();
}
function clearCart() { S.cart = []; save(); render(); }

function exitAdmin() {

}
// Open the owner panel. If a verified session key exists, go straight in; otherwise show the login screen.
async function enterAdmin(opts = {}) {
  if (S.view === 'admin') return;
  const key = adminKey();
  if (key) {
    const ok = await fetch('/api/orders', { headers: { 'x-admin-key': key } }).then(r => r.ok).catch(() => false);
    if (ok) return openAdminPanel();
    setAdminKey('');
  }
  S.showLogin = true; S.loginError = '';
  if (location.pathname.toLowerCase() !== '/admin') history.replaceState(null, '', '/admin');
  render();
  requestAnimationFrame(() => document.getElementById('login-pw')?.focus());
}
async function submitLogin(ev) {
  ev.preventDefault();
  const input = document.getElementById('login-pw');
  const btn = document.getElementById('login-btn');
  const pw = (input?.value || '').trim();
  if (!pw) { S.loginError = 'Enter your password'; render(); return; }
  btn.classList.add('loading');
  const ok = await fetch('/api/orders', { headers: { 'x-admin-key': pw } }).then(r => r.ok).catch(() => false);
  btn.classList.remove('loading');
  if (!ok) { setAdminKey(''); S.loginError = 'Incorrect password'; render(); requestAnimationFrame(() => document.getElementById('login-pw')?.focus()); return; }
  setAdminKey(pw);
  openAdminPanel();
}
function openAdminPanel() {
  S.showLogin = false; S.loginError = '';
  if (location.pathname.toLowerCase() !== '/admin') history.replaceState(null, '', '/admin');
  S.view = 'admin'; S.route = 'home';
  window.scrollTo({ top: 0 }); save(); render(); syncOrders(); loadAllReviews(); loadProducts(); loadSettings();
  toast('Signed in', 'ok');
}
function cancelLogin() {
  S.showLogin = false; S.loginError = '';

}

function toggleView() { S.view === 'admin' ? exitAdmin() : enterAdmin(); }

/* ---- checkout ---- */
function nextStep() {
  if (S.checkoutStep === 1 && !validateShipping()) { toast('Please complete required fields', 'err'); render(); return; }
  S.checkoutStep = Math.min(3, S.checkoutStep + 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  save(); render();
}
function prevStep() { S.checkoutStep = Math.max(1, S.checkoutStep - 1); save(); render(); }
function validateShipping() {
  const s = S.shipping;
  if (shipBlocked()) return false;
  return s.name.trim() && /^[0-9+\-\s()]{7,}$/.test(s.phone) && /\S+@\S+\.\S+/.test(s.email) && s.address.trim() && s.city.trim();
}
function bindShipping(k, v) { S.shipping[k] = v; save(); }
async function placeOrder(btn) {
  const cc = shipCountry();
  if (shipBlocked(cc)) { toast(`We don't deliver to ${countryName(cc)} yet`, 'err'); return; }
  btn.classList.add('loading');
  const items = cartDetailed().map(c => ({ name: c.p.name, qty: c.qty, price: c.p.price }));
  const sub = cartSubtotal();
  const ship = shipCost(sub, cc) || 0;
  const order = {
    id: 'BF-' + (1043 + S.orders.length),
    name: S.shipping.name, phone: S.shipping.phone, email: S.shipping.email,
    country: cc, countryName: countryName(cc),
    city: S.shipping.city, address: S.shipping.address, postal: S.shipping.postal, notes: S.shipping.notes,
    method: S.paymentMethod, items, subtotal: sub, shipping: ship, total: sub + ship,
    currency: S.fx.currency, fxRate: S.fx.rate,
    displayTotal: price(sub + ship),
    status: 'Pending Payment Verification', date: new Date().toISOString().slice(0, 10),
  };
  // Persist to the server so the owner sees it in the admin panel from any device.
  // Falls back to local-only if the API is not available (e.g. opened as a plain file).
  try {
    const res = await fetch('/api/orders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order),
    });
    if (res.ok) { const saved = await res.json(); if (saved && saved.id) order.id = saved.id; order.synced = true; }
  } catch (e) { /* offline / static hosting — keep local copy */ }

  S.orders.unshift(order);
  S.cart = [];
  S.lastOrder = order;
  S.checkoutStep = 3;
  save(); render();
  btn.classList.remove('loading');
  toast(order.synced ? 'Order placed — send your payment proof' : 'Order saved — send your payment proof', 'ok');
}

/* Pull server-side orders into the admin panel (owner only) */
async function syncOrders() {
  if (!adminKey()) return;
  try {
    const res = await fetch('/api/orders', { headers: { 'x-admin-key': adminKey() } });
    if (res.status === 401) { setAdminKey(''); return; }
    if (!res.ok) return;
    const remote = await res.json();
    if (!Array.isArray(remote)) return;
    const seen = new Set(remote.map(o => o.id));
    S.orders = [...remote, ...S.orders.filter(o => !seen.has(o.id))];
    save(); if (S.view === 'admin') render();
  } catch (e) {}
}

function bindFeedback(k, v) { S.feedbackForm[k] = v; save(); }
async function submitFeedback(btn) {
  const f = S.feedbackForm;
  if (!f.name.trim() || f.message.trim().length < 3) { toast('Please add your name and a short message', 'err'); return; }
  btn.classList.add('loading');
  try {
    const res = await fetch('/api/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: f.name.trim(), rating: f.rating, message: f.message.trim() }),
    });
    btn.classList.remove('loading');
    if (res.ok) {
      S.feedbackForm = { name: '', rating: 5, message: '' };
      S.feedbackSent = true;
      save(); render();
      toast('Thank you for your feedback!', 'ok');
    } else { toast('Could not send — please try again', 'err'); }
  } catch (e) { btn.classList.remove('loading'); toast('Could not send — please try again', 'err'); }

/* ---- image upload: shrink the photo in the browser before storing it ---- */
function compressImage(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('Not an image'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = quality, out = cv.toDataURL('image/jpeg', q);
        while (out.length > 140000 && q > 0.4) { q -= 0.08; out = cv.toDataURL('image/jpeg', q); }
        resolve(out);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ==================================================================== */
/*  TOAST                                                                */
/* ==================================================================== */
function toast(msg, kind = 'ok') {
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  const color = kind === 'err' ? 'var(--err)' : 'var(--ok)';
  el.className = 'toast-in pointer-events-auto glass depth-2 rounded-full px-5 py-3 text-sm font-medium flex items-center gap-2';
  el.style.color = 'var(--ink)';
  el.innerHTML = `<span class="inline-flex h-5 w-5 items-center justify-center rounded-full text-white" style="background:${color}">${kind === 'err' ? '!' : '✓'}</span>${msg}`;
  host.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s, transform .4s'; el.style.opacity = '0'; el.style.transform = 'translateY(12px)'; setTimeout(() => el.remove(), 400); }, 2400);
}
let _undoTimer = null;
function undoToast(msg, onUndo, secs = 12) {
  const host = document.getElementById('toast-host');
  if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast-in pointer-events-auto glass depth-2 rounded-full px-5 py-3 text-sm font-medium flex items-center gap-3';
  el.style.color = 'var(--ink)';
  el.innerHTML = `<span class="inline-flex h-5 w-5 items-center justify-center rounded-full text-white" style="background:var(--ok)">✓</span><span>${msg}</span>`;
  const kill = () => { el.style.transition = 'opacity .4s, transform .4s'; el.style.opacity = '0'; el.style.transform = 'translateY(12px)'; setTimeout(() => el.remove(), 400); };
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'font-semibold underline shrink-0';
  btn.style.color = 'var(--brand)';
  btn.textContent = 'Undo';
  btn.onclick = () => { clearTimeout(_undoTimer); kill(); try { onUndo(); } catch (e) {} };
  el.appendChild(btn);
  host.appendChild(el);
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(kill, secs * 1000);
}
function pulseCart() {
  const c = document.getElementById('cart-btn');
  if (!c) return;
  c.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 450, easing: 'cubic-bezier(0.34,1.56,0.64,1)' });
}

         ${imgs.map((_, di) => `<span class="h-1.5 w-1.5 rounded-full bg-white" style="opacity:${di === 0 ? '1' : '.45'};box-shadow:0 0 3px rgba(0,0,0,.4)"></span>`).join('')}

function orderSummaryCard() {
  const lines = cartDetailed();
  if (!lines.length && !S.lastOrder) return '';
  const useLast = !lines.length && S.lastOrder;
  const items = useLast ? S.lastOrder.items.map(i => ({ name:i.name, qty:i.qty, price:i.price })) : lines.map(c => ({ name:c.p.name, qty:c.qty, price:c.p.price }));
  const sub = items.reduce((s,i)=>s+i.price*i.qty,0);
  return `
  <div class="rounded-2xl p-5 mb-6 depth-1" style="background:var(--card)">
    <p class="font-display font-semibold mb-3" style="color:var(--brand)">Order Summary</p>
    <div class="space-y-2 text-sm" style="color:var(--ink)">
      ${items.map(i => `<div class="flex justify-between gap-2"><span>${i.name} × ${i.qty}</span><span>${price(i.price*i.qty)}</span></div>`).join('')}
      <div class="h-px my-2" style="background:var(--line)"></div>
      <div class="flex justify-between"><span>Subtotal</span><span>${price(sub)}</span></div>
      ${shipCost(sub) === null
        ? `<div class="flex justify-between text-xs" style="color:var(--err)"><span>Delivery to ${countryName(shipCountry())}</span><span>not available</span></div>`
        : `<div class="flex justify-between"><span>Shipping${shipCost(sub) ? (shipCountry()==='PK'?' (Pakistan)':' ('+countryName(shipCountry())+')') : ''}</span><span>${shipCost(sub) ? price(shipCost(sub)) : 'Free'}</span></div>
           ${shipCost(sub) && shipCountry()==='PK' ? `<div class="flex justify-between text-xs" style="color:var(--ok)"><span>Add ${price(FREE_SHIP_MIN() - sub)} for free shipping</span><span></span></div>` : ''}`}
      <div class="flex justify-between font-semibold text-base pt-1" style="color:var(--brand)"><span>Total</span><span>${shipCost(sub)===null ? '—' : price(sub + shipCost(sub))}</span></div>
    </div>
  </div>`;
}

function CheckoutStep1() {
  const s = S.shipping;
  const f = (k, label, opts = {}) => `

    </label>`;
  const cc = shipCountry();
  const blocked = shipBlocked(cc);
  const sc = shipCost(cartSubtotal(), cc);
  return `
  ${orderSummaryCard()}

        <span class="text-xs font-medium mb-1.5 block" style="color:var(--ink)">Country *</span>

          ${Object.entries(COUNTRIES).map(([code,name]) => `<option value="${code}" ${cc===code?'selected':''}>${name}</option>`).join('')}

      </label>
      ${f('name','Full name',{req:true,ph:'Manahil Ahmed'})}
      ${f('phone','Phone / WhatsApp',{req:true,ph:'03XX-XXXXXXX',type:'tel'})}
      ${f('email','Email',{req:true,ph:'you@email.com',type:'email'})}
      ${f('city','City',{req:true,ph:'Lahore'})}
      <div class="sm:col-span-2">${f('address','Full address',{req:true,area:true,ph:'House, street, area…'})}</div>
      ${f('postal','Postal code',{ph:'54000'})}
      ${f('notes','Order notes (optional)',{ph:'Anything we should know?'})}

function AdminShipping() {

    const ccs = Object.keys(tbl).filter(cc => zoneObj[cc] != null).sort(byName);
    ccs.forEach(cc => seen.add(cc));
    return [name, ccs];
  });
  const extra = Object.keys(zoneObj).filter(cc => !seen.has(cc)).sort(byName);
  if (extra.length) groups.push(['Other', extra]);
  const totalZones = Object.keys(zoneObj).length;
  const missing = Object.keys(INTL_ZONES).filter(cc => zoneObj[cc] == null).length;
  const zoneRow = (cc) => `
    <div class="flex items-center gap-2">
      <span class="text-sm font-mono w-8" style="color:var(--brand)">${cc}</span>
      <span class="text-sm flex-1 truncate" style="color:var(--ink)">${countryName(cc)}</span>
      <input type="number" min="0" class="field !py-1.5 w-28 text-sm" value="${zoneObj[cc]}" oninput="S.ship.intl.zones['${cc}']=Math.max(0,Math.round(+this.value||0));save()">
      <button onclick="removeZone('${cc}')" class="p-1.5 rounded-lg hover:bg-black/5" style="color:var(--err)">${I.trash}</button>

    <label class="block">
      <span class="text-xs font-medium mb-1 block" style="color:var(--ink)">${label}</span>
      <input type="number" min="0" class="field" value="${val}" oninput="bindShip('${path}',this.value)">
    </label>`;
  return `
  <div class="max-w-2xl space-y-5">
    <p class="text-sm" style="color:var(--ink)">All amounts are in <strong>Rupees (PKR)</strong>. Customers abroad see them auto-converted to their currency.</p>

    <div class="rounded-2xl p-5 depth-1" style="background:#fff;border:1px solid var(--line)">

        ${fld('Delivery charge (Rs.)', 'pk.rate', S.ship.pk.rate)}
        ${fld('Free delivery over (Rs.)', 'pk.freeOver', S.ship.pk.freeOver)}
      </div>
    </div>

    <div class="rounded-2xl p-5 depth-1" style="background:#fff;border:1px solid var(--line)">
      <h4 class="font-display font-bold mb-1" style="color:var(--brand)">Countries we don't ship to</h4>
      <p class="text-xs mb-2" style="color:var(--sand)">2-letter country codes, comma-separated. IN = India.</p>
      <input class="field text-sm" value="${(S.ship.blocked || []).join(', ')}" oninput="setBlocked(this.value)" placeholder="IN">
      <p class="text-xs mt-1" style="color:var(--ink)">Currently blocked: <span id="blocked-preview">${S.ship.blocked.length ? S.ship.blocked.join(', ') : '(none)'}</span></p>
    </div>

    <div class="rounded-2xl p-5 depth-1" style="background:#fff;border:1px solid var(--line)">
      <h4 class="font-display font-bold mb-3" style="color:var(--brand)">International delivery</h4>
      ${fld('Default charge for any other country (Rs.)', 'intl.default', S.ship.intl.default)}
      <div class="flex flex-wrap items-center justify-between gap-2 mt-4 mb-1">
        <p class="text-xs font-medium" style="color:var(--ink)">Per-country rates <span style="color:var(--sand)">(${totalZones} listed)</span></p>
        ${missing ? `<button onclick="loadSuggestedZones()" class="btn btn-ghost px-3 py-1.5 text-xs"><span class="btn-label">➕ Add suggested rates for ${missing} more countries</span></button>` : ''}
      </div>
      <div class="space-y-3">
        ${totalZones ? groups.filter(([, ccs]) => ccs.length).map(([name, ccs]) => `
          <div>
            <p class="text-[11px] uppercase tracking-wide mb-1.5" style="color:var(--sand)">${name}</p>

      </div>
      <div class="flex items-end gap-2 mt-4">
        <label class="block"><span class="text-[11px] mb-1 block" style="color:var(--sand)">Country code</span>
          <input id="zone-cc" class="field !py-1.5 w-24 text-sm" placeholder="AE" maxlength="2"></label>

async function handleHomeImage(input) {

  const status = document.getElementById('home-img-status');

  try {
    const uri = await compressImage(file, 1400, 0.78);
    S.ship.home = S.ship.home || {};
    S.ship.home.whyImg = uri;
    save(); render();
  } catch (e) {
    if (status) status.textContent = "Couldn't read that image — try a JPG or PNG.";

function setupReveal() {
  const els = document.querySelectorAll('.reveal:not(.in)');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
  els.forEach(el => io.observe(el));
}

function setupFilmstrip() {
  const fs = document.getElementById('filmstrip');
  if (!fs) return;
  const bow = fs.querySelector('.filmstrip-bow');
  fs.querySelectorAll('.film-panel').forEach(p => p.addEventListener('click', () => setCategory(p.dataset.cat)));
  if (matchMedia('(pointer: coarse)').matches) return;
  fs.addEventListener('pointermove', e => {
    const r = fs.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    bow.style.setProperty('--ry', (px * 6).toFixed(2) + 'deg');
    bow.style.setProperty('--rx', (6 - py * 4).toFixed(2) + 'deg');
  });
  fs.addEventListener('pointerleave', () => {
    bow.style.setProperty('--ry', '0deg');
    bow.style.setProperty('--rx', '6deg');
  });
}

function setupTilt() {
  if (matchMedia('(pointer: coarse)').matches) return;
  document.querySelectorAll('.tilt').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `rotateY(${px * 9}deg) rotateX(${-py * 9}deg) translateZ(6px)`;
    });
    el.addEventListener('pointerleave', () => { el.style.transform = ''; });
  });
}

function sectionHead(title, sub, left = false) {
